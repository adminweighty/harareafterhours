name: harare-after-hours

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "harare_after_hours"
      POSTGRES_USER: "harare"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-harare_after_hours_dev}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harare -d harare_after_hours"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  campaign-api:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://harare:${POSTGRES_PASSWORD:-harare_after_hours_dev}@postgres:5432/harare_after_hours?sslmode=disable"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
