<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081516">
  <title>Harare Nights</title>
  <style>
    :root{color-scheme:dark;--ink:#f7f2e7;--muted:#aab8b5;--gold:#f4bb57;--lime:#b9e66d;--line:#274143;--panel:#102426;--bg:#071315}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 85% 8%,#27433b 0,transparent 32rem),radial-gradient(circle at 8% 100%,#38223b 0,transparent 34rem),var(--bg);display:grid;place-items:center;padding:24px}
    main{width:min(880px,100%);padding:clamp(28px,7vw,72px);border:1px solid var(--line);border-radius:32px;background:linear-gradient(145deg,rgba(16,36,38,.96),rgba(8,21,22,.92));box-shadow:0 28px 90px #0008;position:relative;overflow:hidden}
    main:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--gold),#ff735c,var(--lime))}
    .eyebrow{color:var(--gold);font-size:.78rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(2.8rem,9vw,6rem);line-height:.9;margin:.3em 0 .25em;letter-spacing:-.07em}p{max-width:630px;color:var(--muted);font-size:clamp(1rem,2vw,1.2rem);line-height:1.7}
    nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}a{color:#071315;background:var(--lime);font-weight:850;text-decoration:none;padding:14px 20px;border-radius:14px}a.secondary{background:transparent;color:var(--ink);border:1px solid #466062}footer{margin-top:42px;color:#78908c;font-size:.82rem}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Weighty Premier Solutions</div>
    <h1>Harare<br>Nights</h1>
    <p>An evening action adventure through a fictionalised Harare. Find help, learn how your data is handled, or return to the city.</p>
    <nav aria-label="Legal and support links">
      <a href="/support">Get support</a>
      <a class="secondary" href="/privacy">Privacy policy</a>
    </nav>
    <footer>Harare Nights &middot; com.weighty.hararenights</footer>
  </main>
</body>
</html>
